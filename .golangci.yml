version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Developer tools read and write files in the repository and call the
      # NetBox server the developer points them at.
      - path: ^tools/
        linters: [gosec]
      - path: _test\.go$
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Gluendo/terraform-provider-netboxplugins
